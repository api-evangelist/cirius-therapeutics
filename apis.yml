aid: cirius-therapeutics
name: Cirius Therapeutics
description: 'Cirius Therapeutics, Inc. is a privately held clinical-stage pharmaceutical
  company based in Grand Rapids, Michigan, developing oral therapies for chronic metabolic
  diseases driven by insulin resistance, including Type 2 Diabetes, Type 1 Diabetes,
  obesity and gestational diabetes. Its lead candidate, azemiglitazone (CIR-0602K /
  MSDC-0602K), is a next-generation insulin sensitizer that inhibits the mitochondrial
  pyruvate carrier (MPC) to re-balance mitochondrial metabolism, improve glycemic control,
  preserve lean muscle mass and shift visceral fat to subcutaneous and brown adipose
  tissue, including in combination with GLP-1 receptor agonists such as tirzepatide.
  The company publishes a corporate marketing website only; it operates no developer
  program, public API, or machine-readable API contract.'
